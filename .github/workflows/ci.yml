name: CI

on:
  push:
    branches: [ main, ci/test-selfhosted ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Runner policy: Linux jobs run on the self-hosted fleet. Label with exactly
# [self-hosted, Linux] — never add arch labels: the fleet spans arm64 and
# x86_64 hosts and jobs must stay schedulable on both. The runner image bakes
# a pinned stable toolchain (rustfmt + clippy), so there is no toolchain
# action, and no cache action either: the fleet mounts persistent cargo
# registry/target volumes, which is what makes these jobs fast. Tools like
# cargo-audit/cargo-deny/cargo-tarpaulin live in the fleet's shared cargo
# cache, so the `cargo install` steps below are no-ops after the first run.
jobs:
  autoformat:
    name: Autoformat
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Run cargo clippy fix
        run: cargo clippy --fix --all-features --all-targets --allow-dirty --allow-staged
      - name: Commit autoformat changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "autoformat" && git push || true

  check:
    name: Check
    runs-on: [self-hosted, Linux]
    needs: autoformat
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo check
        run: cargo check --all-features

  test:
    name: Test
    runs-on: [self-hosted, Linux]
    needs: autoformat
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: cargo test --all-features

  audit:
    name: Security Audit
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo audit
        run: cargo install cargo-audit && cargo audit

  deny:
    name: Cargo Deny
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo deny
        run: cargo install cargo-deny && cargo deny --all-features --log-level warn check

  coverage:
    name: Code Coverage
    runs-on: [self-hosted, Linux]
    needs: autoformat
    environment: codecov
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run tarpaulin
        run: cargo tarpaulin --ignore-tests --out xml --output-dir coverage
      - name: Install gpg (codecov-action verifies its CLI signature with it)
        run: command -v gpg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq gnupg)
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
